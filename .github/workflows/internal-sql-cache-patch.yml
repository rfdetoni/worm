name: Internal SQL cache patch

on:
  push:
    branches: [fix/sql-cache-bounds-20260910]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sql-cache-bounds-20260910

      - name: Apply surgical OrmManager cache changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('worm/src/main/java/com/github/rfdetoni/worm/orm/OrmManager.java')
          text = path.read_text()

          old_partial = '    private final java.util.concurrent.ConcurrentMap<String, String> partialUpdateSqlCache = new java.util.concurrent.ConcurrentHashMap<>();'
          new_partial = '    private final BoundedConcurrentCache<String, String> partialUpdateSqlCache = new BoundedConcurrentCache<>(4096);'
          old_paged_field = '    private final java.util.concurrent.ConcurrentMap<String, String> pagedSqlCache = new java.util.concurrent.ConcurrentHashMap<>();\n'
          old_paged_use = '        String paginatedSql = pagedSqlCache.computeIfAbsent(baseSql, ignored -> baseSql + " LIMIT ? OFFSET ?");'
          new_paged_use = '        String paginatedSql = baseSql + " LIMIT ? OFFSET ?";'

          replacements = [
              (old_partial, new_partial, 'partial update cache'),
              (old_paged_field, '', 'paged SQL cache field'),
              (old_paged_use, new_paged_use, 'paged SQL cache use'),
          ]
          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one {label} occurrence, found {text.count(old)}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          rm .github/workflows/internal-sql-cache-patch.yml

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worm/src/main/java/com/github/rfdetoni/worm/orm/OrmManager.java .github/workflows/internal-sql-cache-patch.yml
          git commit -m "perf(orm): bound dynamic SQL caches"
          git push origin HEAD:fix/sql-cache-bounds-20260910
